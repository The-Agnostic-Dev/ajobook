<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ajobook{% endblock %} · Ajobook</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Ajobook</a>
    {% if coordinator_name %}
    <nav>
      <a href="/">Dashboard</a>
      <a href="/members">Find a member</a>
      <a href="/groups/new">New group</a>
      <span class="who">{{ coordinator_name }}</span>
      <form method="post" action="/logout" class="inline"><button class="link">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for f in flashes %}
    <p class="flash {{ f.kind }}" role="status">{{ f.message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">Ajobook · amounts in Naira · dates in Lagos time ({{ today|longdate }})</footer>
</body>
</html>
