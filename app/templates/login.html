{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <p class="muted">For group coordinators. Members get their statements from their coordinator.</p>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" id="username" value="{{ username }}" autocomplete="username" required></label>
    <label>Password <input name="password" id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Log in</button>
  </form>
</section>
{% endblock %}
